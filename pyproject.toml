[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atar-research"
version = "0.1.0"
description = "Reproducible strategy research with explicit time boundaries and staged evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Yingrui Shang / ZiyaTech"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "json5>=0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
atar = "atar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
