name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        pandas: ["pandas>=2,<3", "pandas>=3,<4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "${{ matrix.pandas }}"
      - run: python -m pytest -q
      - run: python -m atar demo --output artifacts/ci-demo
      - run: bash -n examples/slurm/demo_array.sh
